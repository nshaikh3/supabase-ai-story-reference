name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:showcase
      - run: npx playwright install --with-deps chromium
      - run: npm run test:showcase
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: dependencies
        run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run supabase:start:core
      - run: npm run local:env
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:lint
      - run: npm run db:advisors
      - run: npm run db:types:check
      - run: npm run db:concurrency
      - run: npm run ops:cleanup
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run db:performance
      - run: npm run db:reset && npm run db:test
      - if: always() && steps.dependencies.outcome == 'success'
        run: npm run supabase:stop
