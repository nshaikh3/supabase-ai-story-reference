name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run supabase:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:lint
      - run: npm run db:types:check
      - if: always()
        run: npm run supabase:stop
