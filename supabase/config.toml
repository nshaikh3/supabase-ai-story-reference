# Local-only reference project. CLI 2.118.0; migrations are authoritative.
project_id = "supabase-ai-story-reference"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
# Also enforced with explicit revocations in each application migration.
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 55329

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[local_smtp]
enabled = true
port = 55324

# Studio and postgres-meta support local inspection and MCP.
[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

# Realtime delivers private story status notifications.
[realtime]
enabled = true
[storage]
enabled = true
file_size_limit = "2MiB"
[storage.vector]
enabled = false
[edge_runtime]
enabled = true
# Per-request workers avoid cumulative CPU retirement during local development.
# Resource limits and gateway JWT verification remain enabled.
policy = "oneshot"
inspector_port = 55328
[analytics]
enabled = false
port = 55327

[functions.generate-story]
verify_jwt = true
